<!DOCTYPE html>
<html lang="ur">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ایڈوانسڈ لائیو جی پی ایس ٹریکر</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            direction: rtl;
        }
        html, body, #map {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }
        #loader {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #111827;
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10000;
        }
        .spinner {
            border: 4px solid rgba(255,255,255,0.3);
            border-top: 4px solid #3b82f6;
            border-radius: 50%;
            width: 40px; height: 40px;
            animation: spin 1s linear infinite;
            margin-bottom: 15px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* HUD & Controls */
        .top-controls {
            position: absolute;
            top: 15px;
            right: 15px;
            z-index: 2000;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .btn-ctrl {
            background: rgba(0, 0, 0, 0.85);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 10px 14px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            backdrop-filter: blur(5px);
            font-size: 13px;
        }

        .hud-panel {
            position: absolute;
            bottom: 25px;
            left: 15px;
            z-index: 2000;
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 12px 18px;
            border-radius: 12px;
            color: white;
            backdrop-filter: blur(8px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }
        .hud-item {
            font-size: 13px;
            margin-bottom: 4px;
        }
        .hud-value {
            font-weight: bold;
            color: #38bdf8;
        }

        .emoji-marker {
            font-size: 28px;
            text-align: center;
            line-height: 1;
            user-select: none;
            filter: drop-shadow(0px 3px 5px rgba(0,0,0,0.6));
        }

        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }
        .modal-card {
            background: #ffffff;
            padding: 24px;
            border-radius: 12px;
            width: 85%;
            max-width: 380px;
            text-align: center;
            color: #111;
        }
        .modal-card h3 { margin-bottom: 12px; }
        .modal-card p { color: #4b5563; font-size: 14px; margin-bottom: 20px; }
        .btn-group { display: flex; gap: 10px; justify-content: center; }
        .btn { padding: 10px 20px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .btn-danger { background-color: #ef4444; color: white; }
        .btn-secondary { background-color: #e5e7eb; color: #374151; }
        .btn-primary { background-color: #2563eb; color: white; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="loader">
        <div class="spinner"></div>
        <p id="loaderText">جی پی ایس کنیکٹ ہو رہا ہے...</p>
    </div>

    <div id="map"></div>

    <!-- HUD Overlay -->
    <div class="hud-panel">
        <div class="hud-item">رفتار: <span id="speedVal" class="hud-value">0.0</span> km/h</div>
        <div class="hud-item">فاصلہ: <span id="distVal" class="hud-value">0</span> m</div>
    </div>

    <div class="top-controls">
        <button id="addHomeBtn" class="btn-ctrl">🏠 گھر شامل کریں</button>
        <button id="recenterBtn" class="btn-ctrl">🎯 لوکیشن پر جائیں</button>
    </div>

    <div id="initHomeModal" class="modal-overlay hidden">
        <div class="modal-card">
            <h3>خوش آمدید! 🏠</h3>
            <p>کیا آپ اس وقت اپنے گھر پر موجود ہیں؟</p>
            <div class="btn-group">
                <button id="initNoBtn" class="btn btn-secondary">نہیں</button>
                <button id="initYesBtn" class="btn btn-primary">جی ہاں، یہ گھر ہے</button>
            </div>
        </div>
    </div>

    <div id="houseActionModal" class="modal-overlay hidden">
        <div class="modal-card">
            <h3>گھر کی سیٹنگز 🏠</h3>
            <p>کیا آپ اس گھر کے لوکیشن نشان کو ختم کرنا چاہتے ہیں؟</p>
            <div class="btn-group">
                <button id="cancelHouseBtn" class="btn btn-secondary">منسوخ کریں</button>
                <button id="resetHouseBtn" class="btn btn-danger">ریسیٹ کریں</button>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        let map = null;
        let userMarker = null;
        let houseMarkers = [];
        let pathHistory = [];
        let dotMarkers = [];
        let polyline = null;
        let isAddHomeMode = false;
        let selectedHouseMarker = null;
        let isFirstLocationFound = false;
        let currentCoords = null;
        let totalDistance = 0;

        let stayStartTime = null;
        let stayPosition = null;
        let wakeLock = null;

        const loader = document.getElementById('loader');
        const initHomeModal = document.getElementById('initHomeModal');
        const houseActionModal = document.getElementById('houseActionModal');
        const addHomeBtn = document.getElementById('addHomeBtn');
        const recenterBtn = document.getElementById('recenterBtn');

        window.addEventListener('DOMContentLoaded', () => {
            initMap();
            requestWakeLock();
            startBackgroundTracking();
        });

        // Enable Screen Wake Lock for background persistence
        async function requestWakeLock() {
            try {
                if ('wakeLock' in navigator) {
                    wakeLock = await navigator.wakeLock.request('screen');
                }
            } catch (err) {
                console.log("Wake Lock active error:", err);
            }
        }

        function initMap() {
            map = L.map('map', { zoomControl: false, maxZoom: 20 }).setView([0, 0], 2);
            
            L.tileLayer('https://{s}.google.com/vt/lyrs=s,h&x={x}&y={y}&z={z}', {
                maxZoom: 20,
                subdomains: ['mt0', 'mt1', 'mt2', 'mt3'],
                attribution: 'Google Maps'
            }).addTo(map);

            map.on('zoomend', updateZoomScaling);

            map.on('click', (e) => {
                if (isAddHomeMode) {
                    addHouseMarker(e.latlng);
                    isAddHomeMode = false;
                    addHomeBtn.innerText = "🏠 گھر شامل کریں";
                    addHomeBtn.style.background = "rgba(0, 0, 0, 0.85)";
                }
            });
        }

        function createEmojiIcon(emojiSymbol) {
            return L.divIcon({
                className: 'emoji-marker',
                html: `<div>${emojiSymbol}</div>`,
                iconSize: [30, 30],
                iconAnchor: [15, 15]
            });
        }

        function startBackgroundTracking() {
            if (!navigator.geolocation) {
                alert("آپ کے ڈیوائس میں جی پی ایس سپورٹ نہیں ہے۔");
                loader.classList.add('hidden');
                return;
            }

            navigator.geolocation.watchPosition(
                onLocationUpdate, 
                onLocationError, 
                { 
                    enableHighAccuracy: true, 
                    maximumAge: 0, 
                    timeout: 5000 
                }
            );
        }

        function onLocationUpdate(position) {
            const accuracy = position.coords.accuracy;
            if (accuracy > 25) return;

            const lat = position.coords.latitude;
            const lng = position.coords.longitude;
            const speed = position.coords.speed ? (position.coords.speed * 3.6).toFixed(1) : "0.0";
            
            document.getElementById('speedVal').innerText = speed;

            currentCoords = [lat, lng];

            if (!isFirstLocationFound) {
                isFirstLocationFound = true;
                loader.classList.add('hidden');
                map.setView(currentCoords, 19);
                initHomeModal.classList.remove('hidden');
            }

            if (!userMarker) {
                userMarker = L.marker(currentCoords, { icon: createEmojiIcon('🚶‍♂️'), zIndexOffset: 1000 }).addTo(map);
            } else {
                userMarker.setLatLng(currentCoords);
            }

            map.panTo(currentCoords, { animate: true, duration: 0.5 });

            handleBacktracking(currentCoords);
            handleStayDuration(currentCoords);
        }

        function handleBacktracking(newCoords) {
            if (pathHistory.length < 2) return;

            for (let i = pathHistory.length - 2; i >= 0; i--) {
                let dist = getDistance(newCoords, pathHistory[i]);
                if (dist < 8) {
                    pathHistory = pathHistory.slice(0, i + 1);
                    let removedDots = dotMarkers.splice(i + 1);
                    removedDots.forEach(d => map.removeLayer(d));
                    updatePolyline();
                    break;
                }
            }
        }

        function handleStayDuration(newCoords) {
            const now = Date.now();
            if (!stayPosition) {
                stayPosition = newCoords;
                stayStartTime = now;
                return;
            }

            let distFromStay = getDistance(newCoords, stayPosition);
            if (distFromStay < 10) {
                let minutesStayed = (now - stayStartTime) / (1000 * 60);
                if (minutesStayed >= 30) {
                    commitPathPoint(newCoords);
                    stayStartTime = now;
                }
            } else {
                if (pathHistory.length > 0) {
                    totalDistance += distFromStay;
                    document.getElementById('distVal').innerText = Math.round(totalDistance);
                }
                stayPosition = newCoords;
                stayStartTime = now;
            }
        }

        function commitPathPoint(coords) {
            pathHistory.push(coords);
            const zoomLevel = map.getZoom();
            const dot = L.circleMarker(coords, {
                radius: Math.max(3, zoomLevel - 13),
                color: '#2563eb',
                fillColor: '#60a5fa',
                fillOpacity: 0.9,
                stroke: false
            }).addTo(map);

            dotMarkers.push(dot);
            updatePolyline();
        }

        function updatePolyline() {
            if (polyline) map.removeLayer(polyline);
            const zoomLevel = map.getZoom();
            polyline = L.polyline(pathHistory, {
                color: '#2563eb',
                weight: Math.max(3, zoomLevel - 12),
                opacity: 0.8
            }).addTo(map);
        }

        function updateZoomScaling() {
            const zoomLevel = map.getZoom();
            dotMarkers.forEach(dot => {
                dot.setRadius(Math.max(3, zoomLevel - 13));
            });
            if (polyline) {
                polyline.setStyle({ weight: Math.max(3, zoomLevel - 12) });
            }
        }

        function onLocationError(error) {
            document.getElementById('loaderText').innerText = "جی پی ایس سگنل کی تلاش جاری ہے...";
        }

        document.getElementById('initYesBtn').addEventListener('click', () => {
            if (currentCoords) addHouseMarker(currentCoords);
            initHomeModal.classList.add('hidden');
        });
        document.getElementById('initNoBtn').addEventListener('click', () => {
            initHomeModal.classList.add('hidden');
        });

        function addHouseMarker(latlng) {
            const house = L.marker(latlng, { icon: createEmojiIcon('🏠') }).addTo(map);
            house.on('click', (e) => {
                L.DomEvent.stopPropagation(e);
                selectedHouseMarker = house;
                houseActionModal.classList.remove('hidden');
            });
            houseMarkers.push(house);
        }

        addHomeBtn.addEventListener('click', () => {
            isAddHomeMode = !isAddHomeMode;
            if (isAddHomeMode) {
                addHomeBtn.innerText = "📍 نقشے پر کلک کریں";
                addHomeBtn.style.background = "#2563eb";
            } else {
                addHomeBtn.innerText = "🏠 گھر شامل کریں";
                addHomeBtn.style.background = "rgba(0, 0, 0, 0.85)";
            }
        });

        recenterBtn.addEventListener('click', () => {
            if (currentCoords) {
                map.setView(currentCoords, 19, { animate: true });
            }
        });

        document.getElementById('cancelHouseBtn').addEventListener('click', () => {
            houseActionModal.classList.add('hidden');
            selectedHouseMarker = null;
        });
        document.getElementById('resetHouseBtn').addEventListener('click', () => {
            if (selectedHouseMarker) {
                map.removeLayer(selectedHouseMarker);
                houseMarkers = houseMarkers.filter(m => m !== selectedHouseMarker);
                selectedHouseMarker = null;
            }
            houseActionModal.classList.add('hidden');
        });

        function getDistance(coord1, coord2) {
            const R = 6371e3;
            const rad1 = coord1[0] * Math.PI / 180;
            const rad2 = coord2[0] * Math.PI / 180;
            const dRad = (coord2[0] - coord1[0]) * Math.PI / 180;
            const dLng = (coord2[1] - coord1[1]) * Math.PI / 180;
            const a = Math.sin(dRad/2) * Math.sin(dRad/2) +
                      Math.cos(rad1) * Math.cos(rad2) *
                      Math.sin(dLng/2) * Math.sin(dLng/2);
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        }
    </script>
</body>
    </html>
