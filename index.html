<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultra Pro GPS Tracker</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        html, body, #map { width: 100%; height: 100%; overflow: hidden; background-color: #111; }
        
        #loader {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #111827; color: white; display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 10000;
        }
        .spinner {
            border: 4px solid rgba(255,255,255,0.3); border-top: 4px solid #38bdf8;
            border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin-bottom: 15px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .top-controls {
            position: absolute; top: 15px; right: 15px; z-index: 2000; display: flex; flex-direction: column; gap: 10px;
        }
        .btn-ctrl {
            background: rgba(15, 23, 42, 0.9); color: #fff; border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 10px 14px; border-radius: 8px; font-weight: bold; cursor: pointer; backdrop-filter: blur(5px); font-size: 13px;
        }
        .btn-highlight { background: #22c55e; border: none; }

        .hud-panel {
            position: absolute; bottom: 25px; left: 15px; z-index: 2000;
            background: rgba(15, 23, 42, 0.9); border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 12px 18px; border-radius: 12px; color: white; backdrop-filter: blur(8px);
        }
        .hud-item { font-size: 13px; margin-bottom: 4px; }
        .hud-value { font-weight: bold; color: #38bdf8; }

        .emoji-marker {
            font-size: 32px; text-align: center; line-height: 1; user-select: none;
            filter: drop-shadow(0px 4px 6px rgba(0,0,0,0.6)); cursor: pointer; transition: transform 0.2s;
        }

        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.7); display: flex; justify-content: center; align-items: center; z-index: 9999;
        }
        .modal-card {
            background: #fff; padding: 24px; border-radius: 12px; width: 85%; max-width: 380px; text-align: center; color: #111;
        }
        .modal-card h3 { margin-bottom: 12px; }
        .modal-card p { color: #4b5563; font-size: 15px; margin-bottom: 20px; font-weight: 500; }
        .btn-group { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
        .btn { padding: 10px 16px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .btn-danger { background-color: #ef4444; color: white; }
        .btn-secondary { background-color: #e5e7eb; color: #374151; }
        .btn-primary { background-color: #38bdf8; color: white; }
        .btn-place { background-color: #f3f4f6; border: 1px solid #d1d5db; font-size: 16px; padding: 10px; width: 45%; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="loader">
        <div class="spinner"></div>
        <p>Calibrating Ultra-Accurate GPS...</p>
    </div>

    <div id="map"></div>

    <div class="hud-panel">
        <div class="hud-item">Speed: <span id="speedVal" class="hud-value">0.0</span> km/h</div>
        <div class="hud-item">Status: <span id="modeVal" class="hud-value" style="color: #22c55e;">Standing Still 🧍</span></div>
    </div>

    <div class="top-controls">
        <button id="addPlaceBtn" class="btn-ctrl">📍 Add Place</button>
        <button id="makeLineBtn" class="btn-ctrl btn-highlight">📏 Make Line</button>
        <button id="manualReturnBtn" class="btn-ctrl">🔄 Return Mode</button>
        <button id="recenterBtn" class="btn-ctrl">🎯 Recenter</button>
    </div>

    <!-- Select Place Type Modal -->
    <div id="placeTypeModal" class="modal-overlay hidden">
        <div class="modal-card">
            <h3>Select Place Type</h3>
            <p>What kind of place is this?</p>
            <div class="btn-group">
                <button class="btn btn-place" onclick="savePlace('🏠', 'Home')">🏠 Home</button>
                <button class="btn btn-place" onclick="savePlace('🕌', 'Mosque')">🕌 Mosque</button>
                <button class="btn btn-place" onclick="savePlace('🏢', 'Office')">🏢 Office</button>
                <button class="btn btn-place" onclick="savePlace('🏪', 'Shop')">🏪 Shop</button>
                <button class="btn btn-secondary" style="width: 100%; margin-top: 10px;" onclick="closeModals()">Cancel</button>
            </div>
        </div>
    </div>

    <!-- Place Action Modal (Clicking an existing place) -->
    <div id="placeActionModal" class="modal-overlay hidden">
        <div class="modal-card">
            <h3>Place Options <span id="actionPlaceEmoji"></span></h3>
            <p>What do you want to do?</p>
            <div class="btn-group">
                <button id="startFromHereBtn" class="btn btn-primary" style="width: 100%;">Start Tracking From Here</button>
                <button id="deletePlaceBtn" class="btn btn-danger" style="width: 100%;">Delete This Place</button>
                <button class="btn btn-secondary" style="width: 100%;" onclick="closeModals()">Cancel</button>
            </div>
        </div>
    </div>

    <!-- Return Journey Modal -->
    <div id="returnModal" class="modal-overlay hidden">
        <div class="modal-card">
            <h3>Return Journey</h3>
            <p>Are you going back?</p>
            <div class="btn-group">
                <button id="returnNoBtn" class="btn btn-secondary">Cancel</button>
                <button id="returnYesBtn" class="btn btn-primary" style="background:#22c55e;">Yes</button>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        let map, userMarker;
        let places = []; 
        let selectedPlaceId = null;
        let pendingPlaceCoords = null;
        
        let pathHistory = [];
        let trackedDots = []; 
        
        let greenLine = null;
        let isLineFormed = false;
        let isReturningMode = false;
        let wrongWayDots = [];
        
        let isAddPlaceMode = false;
        let isFirstLocationFound = false;
        
        let currentCoords = null;
        let lastValidCoords = null;
        let currentEmoji = '🧍'; 

        const loader = document.getElementById('loader');

        window.addEventListener('DOMContentLoaded', () => {
            initMap();
            startBackgroundTracking();
        });

        function initMap() {
            map = L.map('map', { zoomControl: false, maxZoom: 20 }).setView([0, 0], 2);
            L.tileLayer('https://{s}.google.com/vt/lyrs=s,h&x={x}&y={y}&z={z}', {
                maxZoom: 20, subdomains: ['mt0', 'mt1', 'mt2', 'mt3']
            }).addTo(map);

            map.on('click', (e) => {
                if (isAddPlaceMode) {
                    pendingPlaceCoords = [e.latlng.lat, e.latlng.lng];
                    document.getElementById('placeTypeModal').classList.remove('hidden');
                    isAddPlaceMode = false;
                    document.getElementById('addPlaceBtn').innerText = "📍 Add Place";
                    document.getElementById('addPlaceBtn').style.background = "rgba(15, 23, 42, 0.9)";
                }
            });
        }

        function createEmojiIcon(emoji) {
            return L.divIcon({ className: 'emoji-marker', html: `<div>${emoji}</div>`, iconSize: [40, 40], iconAnchor: [20, 20] });
        }

        function updateAvatarBySpeed(speedKmh) {
            let newEmoji = '🧍';
            if (speedKmh > 40) newEmoji = '🚗';
            else if (speedKmh > 15) newEmoji = '🏍️';
            else if (speedKmh > 4.5) newEmoji = '🚲';

            if (newEmoji !== currentEmoji) {
                currentEmoji = newEmoji;
                if(userMarker) userMarker.setIcon(createEmojiIcon(currentEmoji));
            }
        }

        function startBackgroundTracking() {
            navigator.geolocation.watchPosition(onLocationUpdate, (err) => console.log(err), { 
                enableHighAccuracy: true, maximumAge: 0, timeout: 5000 
            });
        }

        function onLocationUpdate(position) {
            const accuracy = position.coords.accuracy;
            // Strict filter: Reject bad signals entirely
            if (accuracy > 30) return; 

            const lat = position.coords.latitude;
            const lng = position.coords.longitude;
            currentCoords = [lat, lng];

            let rawSpeed = position.coords.speed || 0;
            let speedKmh = rawSpeed * 3.6;

            if (!isFirstLocationFound) {
                isFirstLocationFound = true;
                lastValidCoords = currentCoords;
                loader.classList.add('hidden');
                map.setView(currentCoords, 19);
                userMarker = L.marker(currentCoords, { icon: createEmojiIcon(currentEmoji), zIndexOffset: 1000 }).addTo(map);
                return; 
            }

            let moveDist = getDistance(lastValidCoords, currentCoords);
            
            // Ultra-Accurate Drift Lock:
            // If standing still (speed is very low and move distance is tiny), DO NOT move the marker.
            if (speedKmh < 1.5 && moveDist < 4) {
                document.getElementById('speedVal').innerText = "0.0";
                updateAvatarBySpeed(0);
                if(!isReturningMode && !isLineFormed) document.getElementById('modeVal').innerText = "Standing Still " + currentEmoji;
                return; // Stop processing, user is standing still
            }

            // Anti-TP Jump Filter
            if (moveDist > 100 && speedKmh < 50) return; 

            // Update UI
            document.getElementById('speedVal').innerText = speedKmh.toFixed(1);
            updateAvatarBySpeed(speedKmh);
            
            if(!isLineFormed && !isReturningMode) {
                document.getElementById('modeVal').innerText = "Tracking " + currentEmoji;
                document.getElementById('modeVal').style.color = "#38bdf8";
            }

            // Valid movement logic
            if (moveDist >= 3) { 
                lastValidCoords = currentCoords;
                userMarker.setLatLng(currentCoords);

                if (!isLineFormed) {
                    addGreenDot(currentCoords);
                } else if (isReturningMode) {
                    handleReturnJourney(currentCoords);
                }
            }
        }

        function addGreenDot(coords) {
            pathHistory.push(coords);
            const dot = L.circleMarker(coords, { radius: 4.5, color: '#22c55e', fillColor: '#22c55e', fillOpacity: 0.9, stroke: false }).addTo(map);
            trackedDots.push({ coords: coords, layer: dot });
        }

        function convertToLine() {
            if (pathHistory.length < 2 || isLineFormed) return;
            
            trackedDots.forEach(d => map.removeLayer(d.layer));
            trackedDots = [];
            
            greenLine = L.polyline(pathHistory, {color: '#22c55e', weight: 6, opacity: 0.9}).addTo(map);
            isLineFormed = true;
            document.getElementById('modeVal').innerText = "Line Formed";
        }

        function handleReturnJourney(currentPos) {
            let { minDist, minIndex } = getClosestNode(currentPos, pathHistory);
            
            if (minDist > 12) { 
                const redDot = L.circleMarker(currentPos, { radius: 4.5, color: '#ef4444', fillColor: '#ef4444', fillOpacity: 0.9, stroke: false }).addTo(map);
                wrongWayDots.push(redDot);
            } else {
                clearWrongWayDots();
                pathHistory = pathHistory.slice(0, minIndex + 1);
                if (greenLine) greenLine.setLatLngs(pathHistory);
                
                if (pathHistory.length < 2 && greenLine) {
                    resetJourneyState();
                }
            }
        }

        function clearWrongWayDots() {
            wrongWayDots.forEach(dot => map.removeLayer(dot));
            wrongWayDots = [];
        }

        function resetJourneyState() {
            trackedDots.forEach(d => map.removeLayer(d.layer));
            trackedDots = [];
            pathHistory = [];
            if (greenLine) { map.removeLayer(greenLine); greenLine = null; }
            clearWrongWayDots();
            isLineFormed = false;
            isReturningMode = false;
            document.getElementById('modeVal').innerText = "Tracking " + currentEmoji;
            document.getElementById('modeVal').style.color = "#38bdf8";
        }

        // --- Multi-Place Logic ---

        function savePlace(emoji, name) {
            let placeId = Date.now();
            let marker = L.marker(pendingPlaceCoords, { icon: createEmojiIcon(emoji) }).addTo(map);
            
            marker.on('click', (e) => {
                L.DomEvent.stopPropagation(e);
                selectedPlaceId = placeId;
                document.getElementById('actionPlaceEmoji').innerText = emoji;
                document.getElementById('placeActionModal').classList.remove('hidden');
            });
            
            places.push({ id: placeId, coords: pendingPlaceCoords, marker: marker, type: name });
            closeModals();
        }

        function closeModals() {
            document.getElementById('placeTypeModal').classList.add('hidden');
            document.getElementById('placeActionModal').classList.add('hidden');
            document.getElementById('returnModal').classList.add('hidden');
        }

        document.getElementById('startFromHereBtn').addEventListener('click', () => {
            let p = places.find(x => x.id === selectedPlaceId);
            if(p) {
                resetJourneyState(); // Clear everything old
                addGreenDot(p.coords); // Start fresh from this place
            }
            closeModals();
        });

        document.getElementById('deletePlaceBtn').addEventListener('click', () => {
            let idx = places.findIndex(h => h.id === selectedPlaceId);
            if (idx > -1) {
                map.removeLayer(places[idx].marker);
                places.splice(idx, 1);
            }
            closeModals();
        });

        // --- Math & UI Helpers ---
        function getDistance(c1, c2) {
            const R = 6371e3;
            const rad1 = c1[0] * Math.PI / 180, rad2 = c2[0] * Math.PI / 180;
            const dRad = (c2[0] - c1[0]) * Math.PI / 180, dLng = (c2[1] - c1[1]) * Math.PI / 180;
            const a = Math.sin(dRad/2) * Math.sin(dRad/2) + Math.cos(rad1) * Math.cos(rad2) * Math.sin(dLng/2) * Math.sin(dLng/2);
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        }

        function getClosestNode(current, pathArr) {
            let minDist = Infinity, minIndex = -1;
            for(let i=0; i<pathArr.length; i++) {
                let d = getDistance(current, pathArr[i]);
                if(d < minDist) { minDist = d; minIndex = i; }
            }
            return { minDist, minIndex };
        }

        document.getElementById('addPlaceBtn').addEventListener('click', () => {
            isAddPlaceMode = !isAddPlaceMode;
            document.getElementById('addPlaceBtn').innerText = isAddPlaceMode ? "📍 Click Map" : "📍 Add Place";
            document.getElementById('addPlaceBtn').style.background = isAddPlaceMode ? "#38bdf8" : "rgba(15, 23, 42, 0.9)";
        });

        document.getElementById('makeLineBtn').addEventListener('click', convertToLine);
        
        document.getElementById('manualReturnBtn').addEventListener('click', () => {
            document.getElementById('returnModal').classList.remove('hidden');
        });

        document.getElementById('returnYesBtn').addEventListener('click', () => {
            isReturningMode = true;
            document.getElementById('modeVal').innerText = "Returning Mode";
            document.getElementById('modeVal').style.color = "#ef4444";
            closeModals();
        });
        document.getElementById('returnNoBtn').addEventListener('click', closeModals);

        document.getElementById('recenterBtn').addEventListener('click', () => {
            if (currentCoords) map.setView(currentCoords, 19, { animate: true });
        });
    </script>
</body>
</html>
