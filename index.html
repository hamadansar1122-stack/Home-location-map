<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Precision GPS Tracker</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        html, body, #map {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }
        #loader {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #111827;
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10000;
            transition: opacity 0.5s ease;
        }
        .spinner {
            border: 4px solid rgba(255,255,255,0.3);
            border-top: 4px solid #3b82f6;
            border-radius: 50%;
            width: 40px; height: 40px;
            animation: spin 1s linear infinite;
            margin-bottom: 15px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .top-controls {
            position: absolute;
            top: 15px;
            right: 15px;
            z-index: 2000;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .btn-ctrl {
            background: rgba(0, 0, 0, 0.85);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 10px 14px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            backdrop-filter: blur(5px);
            font-size: 13px;
        }

        .home-pointer-box {
            position: absolute;
            top: 15px;
            left: 15px;
            z-index: 2000;
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 10px 14px;
            border-radius: 10px;
            color: white;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 13px;
            font-weight: bold;
            backdrop-filter: blur(5px);
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        .arrow-icon {
            font-size: 20px;
            display: inline-block;
            transition: transform 0.2s ease-out;
        }

        .hud-panel {
            position: absolute;
            bottom: 25px;
            left: 15px;
            z-index: 2000;
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 12px 18px;
            border-radius: 12px;
            color: white;
            backdrop-filter: blur(8px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }
        .hud-item {
            font-size: 13px;
            margin-bottom: 4px;
        }
        .hud-value {
            font-weight: bold;
            color: #38bdf8;
        }

        .emoji-marker {
            font-size: 28px;
            text-align: center;
            line-height: 1;
            user-select: none;
            filter: drop-shadow(0px 3px 5px rgba(0,0,0,0.6));
            transition: all 0.3s linear;
            cursor: pointer;
        }

        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }
        .modal-card {
            background: #ffffff;
            padding: 24px;
            border-radius: 12px;
            width: 85%;
            max-width: 380px;
            text-align: center;
            color: #111;
        }
        .modal-card h3 { margin-bottom: 12px; }
        .modal-card p { color: #4b5563; font-size: 14px; margin-bottom: 20px; }
        .btn-group { display: flex; gap: 10px; justify-content: center; }
        .btn { padding: 10px 20px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .btn-danger { background-color: #ef4444; color: white; }
        .btn-secondary { background-color: #e5e7eb; color: #374151; }
        .btn-primary { background-color: #2563eb; color: white; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="loader">
        <div class="spinner"></div>
        <p id="loaderText">Locking Real-time Location...</p>
    </div>

    <div id="map"></div>

    <div id="homePointer" class="home-pointer-box hidden">
        <span id="homeArrow" class="arrow-icon">⬆️</span>
        <div>
            <div>Home Direction</div>
            <div style="font-size: 11px; color: #38bdf8;" id="homeDistText">0 m away</div>
        </div>
    </div>

    <div class="hud-panel">
        <div class="hud-item">Speed: <span id="speedVal" class="hud-value">0.0</span> km/h</div>
        <div class="hud-item">Distance: <span id="distVal" class="hud-value">0</span> m</div>
        <div class="hud-item">Accuracy: <span id="accVal" class="hud-value">--</span> m</div>
    </div>

    <div class="top-controls">
        <button id="addHomeBtn" class="btn-ctrl">🏠 Add Home</button>
        <button id="quickHomeBtn" class="btn-ctrl">📍 Quick Home</button>
        <button id="recenterBtn" class="btn-ctrl">🎯 Recenter</button>
    </div>

    <!-- Quick Home Modal -->
    <div id="quickHomeModal" class="modal-overlay hidden">
        <div class="modal-card">
            <h3>Set Home 🏠</h3>
            <p>Are you currently sitting at your home?</p>
            <div class="btn-group">
                <button id="quickNoBtn" class="btn btn-secondary">No</button>
                <button id="quickYesBtn" class="btn btn-primary">Yes, Set Home</button>
            </div>
        </div>
    </div>

    <!-- Delete/Cancel Home Modal -->
    <div id="deleteHomeModal" class="modal-overlay hidden">
        <div class="modal-card">
            <h3>Home Options 🏠</h3>
            <p>Do you want to delete this Home location?</p>
            <div class="btn-group">
                <button id="cancelDeleteBtn" class="btn btn-secondary">Cancel</button>
                <button id="confirmDeleteBtn" class="btn btn-danger">Delete</button>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        let map = null;
        let userMarker = null;
        let homeCoords = null;
        let homeMarker = null;
        
        let pathHistory = [];
        let trackedDots = []; 
        let dotColorToggle = false; // Toggle between Green and Red
        
        let isAddHomeMode = false;
        let isFirstLocationFound = false;
        let currentCoords = null;
        let lastValidCoords = null;
        let totalDistance = 0;
        let wakeLock = null;

        const loader = document.getElementById('loader');

        window.addEventListener('DOMContentLoaded', () => {
            initMap();
            requestWakeLock();
            startBackgroundTracking();

            setTimeout(() => {
                if (!isFirstLocationFound) {
                    loader.classList.add('hidden');
                }
            }, 6000);
        });

        async function requestWakeLock() {
            try {
                if ('wakeLock' in navigator) {
                    wakeLock = await navigator.wakeLock.request('screen');
                }
            } catch (err) { console.log(err); }
        }

        function initMap() {
            map = L.map('map', { zoomControl: false, maxZoom: 20 }).setView([0, 0], 2);
            
            L.tileLayer('https://{s}.google.com/vt/lyrs=s,h&x={x}&y={y}&z={z}', {
                maxZoom: 20,
                subdomains: ['mt0', 'mt1', 'mt2', 'mt3']
            }).addTo(map);

            // Manual Home Placement on Map Click
            map.on('click', (e) => {
                if (isAddHomeMode) {
                    setHomeLocation([e.latlng.lat, e.latlng.lng]);
                    isAddHomeMode = false;
                    document.getElementById('addHomeBtn').innerText = "🏠 Add Home";
                    document.getElementById('addHomeBtn').style.background = "rgba(0, 0, 0, 0.85)";
                }
            });
        }

        function createEmojiIcon(emojiSymbol) {
            return L.divIcon({
                className: 'emoji-marker',
                html: `<div>${emojiSymbol}</div>`,
                iconSize: [30, 30],
                iconAnchor: [15, 15]
            });
        }

        function startBackgroundTracking() {
            if (!navigator.geolocation) {
                alert("GPS not supported!");
                return;
            }

            navigator.geolocation.watchPosition(
                onLocationUpdate, 
                onLocationError, 
                { 
                    enableHighAccuracy: true, 
                    maximumAge: 0, 
                    timeout: 10000 
                }
            );
        }

        function onLocationUpdate(position) {
            const accuracy = position.coords.accuracy;
            document.getElementById('accVal').innerText = Math.round(accuracy);

            // Strict Filter for starting accuracy
            if (accuracy > 20) return;

            const lat = position.coords.latitude;
            const lng = position.coords.longitude;
            const speed = position.coords.speed ? (position.coords.speed * 3.6).toFixed(1) : "0.0";
            
            document.getElementById('speedVal').innerText = speed;
            currentCoords = [lat, lng];

            if (!isFirstLocationFound) {
                isFirstLocationFound = true;
                lastValidCoords = currentCoords;
                loader.classList.add('hidden');
                
                map.setView(currentCoords, 19);
                userMarker = L.marker(currentCoords, { icon: createEmojiIcon('🚶‍♂️'), zIndexOffset: 1000 }).addTo(map);
                return; 
            }

            let moveDist = getDistance(lastValidCoords, currentCoords);

            // Backtracking logic
            handleBacktrackingDots(currentCoords);

            // Add Red/Green Dot if moved 4 meters away
            if (moveDist >= 4) {
                totalDistance += moveDist;
                document.getElementById('distVal').innerText = Math.round(totalDistance);
                
                lastValidCoords = currentCoords;
                userMarker.setLatLng(currentCoords);
                
                addAlternatingDot(currentCoords);
            } else {
                userMarker.setLatLng(currentCoords);
            }

            updateHomePointer();
        }

        function addAlternatingDot(coords) {
            pathHistory.push(coords);
            
            // Alternates between Green and Red
            let dotColor = dotColorToggle ? '#22c55e' : '#ef4444'; 
            dotColorToggle = !dotColorToggle;

            const dot = L.circleMarker(coords, {
                radius: 4.5,
                color: dotColor,
                fillColor: dotColor,
                fillOpacity: 0.9,
                stroke: false
            }).addTo(map);

            trackedDots.push({ coords: coords, layer: dot });
        }

        function handleBacktrackingDots(newCoords) {
            if (pathHistory.length < 2) return;

            for (let i = pathHistory.length - 2; i >= 0; i--) {
                let distToOldDot = getDistance(newCoords, pathHistory[i]);
                if (distToOldDot < 6) {
                    for (let j = pathHistory.length - 1; j > i; j--) {
                        map.removeLayer(trackedDots[j].layer);
                    }
                    pathHistory = pathHistory.slice(0, i + 1);
                    trackedDots = trackedDots.slice(0, i + 1);
                    break;
                }
            }
        }

        function setHomeLocation(coords) {
            homeCoords = coords;
            if (homeMarker) map.removeLayer(homeMarker);
            
            homeMarker = L.marker(homeCoords, { icon: createEmojiIcon('🏠') }).addTo(map);
            
            // Delete / Cancel options on clicking Home Emoji
            homeMarker.on('click', (e) => {
                L.DomEvent.stopPropagation(e);
                document.getElementById('deleteHomeModal').classList.remove('hidden');
            });

            updateHomePointer();
        }

        function removeHomeLocation() {
            if (homeMarker) {
                map.removeLayer(homeMarker);
                homeMarker = null;
            }
            homeCoords = null;
            document.getElementById('homePointer').classList.add('hidden');
        }

        function updateHomePointer() {
            if (!homeCoords || !currentCoords) return;

            let distToHome = getDistance(currentCoords, homeCoords);
            const pointerBox = document.getElementById('homePointer');

            if (distToHome > 15) {
                pointerBox.classList.remove('hidden');
                document.getElementById('homeDistText').innerText = Math.round(distToHome) + " m away";

                let angle = getBearing(currentCoords[0], currentCoords[1], homeCoords[0], homeCoords[1]);
                document.getElementById('homeArrow').style.transform = `rotate(${angle}deg)`;
            } else {
                pointerBox.classList.add('hidden');
            }
        }

        function getBearing(lat1, lon1, lat2, lon2) {
            const rad = Math.PI / 180;
            const y = Math.sin((lon2 - lon1) * rad) * Math.cos(lat2 * rad);
            const x = Math.cos(lat1 * rad) * Math.sin(lat2 * rad) -
                      Math.sin(lat1 * rad) * Math.cos(lat2 * rad) * Math.cos((lon2 - lon1) * rad);
            const bearing = Math.atan2(y, x) * (180 / Math.PI);
            return (bearing + 360) % 360;
        }

        function onLocationError(err) { console.log(err); }

        // Button Listeners
        document.getElementById('addHomeBtn').addEventListener('click', () => {
            isAddHomeMode = !isAddHomeMode;
            if (isAddHomeMode) {
                document.getElementById('addHomeBtn').innerText = "📍 Click Map Position";
                document.getElementById('addHomeBtn').style.background = "#2563eb";
            } else {
                document.getElementById('addHomeBtn').innerText = "🏠 Add Home";
                document.getElementById('addHomeBtn').style.background = "rgba(0, 0, 0, 0.85)";
            }
        });

        document.getElementById('quickHomeBtn').addEventListener('click', () => {
            document.getElementById('quickHomeModal').classList.remove('hidden');
        });

        document.getElementById('recenterBtn').addEventListener('click', () => {
            if (currentCoords) map.setView(currentCoords, 19, { animate: true });
        });

        // Quick Home Modal Actions
        document.getElementById('quickYesBtn').addEventListener('click', () => {
            if (currentCoords) setHomeLocation(currentCoords);
            document.getElementById('quickHomeModal').classList.add('hidden');
        });
        document.getElementById('quickNoBtn').addEventListener('click', () => {
            document.getElementById('quickHomeModal').classList.add('hidden');
        });

        // Delete Home Modal Actions
        document.getElementById('cancelDeleteBtn').addEventListener('click', () => {
            document.getElementById('deleteHomeModal').classList.add('hidden');
        });
        document.getElementById('confirmDeleteBtn').addEventListener('click', () => {
            removeHomeLocation();
            document.getElementById('deleteHomeModal').classList.add('hidden');
        });

        function getDistance(coord1, coord2) {
            const R = 6371e3;
            const rad1 = coord1[0] * Math.PI / 180;
            const rad2 = coord2[0] * Math.PI / 180;
            const dRad = (coord2[0] - coord1[0]) * Math.PI / 180;
            const dLng = (coord2[1] - coord1[1]) * Math.PI / 180;
            const a = Math.sin(dRad/2) * Math.sin(dRad/2) +
                      Math.cos(rad1) * Math.cos(rad2) *
                      Math.sin(dLng/2) * Math.sin(dLng/2);
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        }
    </script>
</body>
        </html>
