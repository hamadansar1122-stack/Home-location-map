<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPS Location Tracker 3D</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        #map {
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        
        /* Loading Screen */
        #loader {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #111827;
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10000;
        }
        .spinner {
            border: 4px solid rgba(255,255,255,0.3);
            border-top: 4px solid #3b82f6;
            border-radius: 50%;
            width: 40px; height: 40px;
            animation: spin 1s linear infinite;
            margin-bottom: 15px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Control Bar */
        .top-controls {
            position: absolute;
            top: 15px;
            right: 15px;
            z-index: 2000;
            display: flex;
            gap: 10px;
        }
        .btn-ctrl {
            background: rgba(0, 0, 0, 0.75);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 10px 16px;
            border-radius: 8px;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            cursor: pointer;
            backdrop-filter: blur(4px);
        }

        /* Emoji Marker Styles */
        .emoji-marker {
            font-size: 28px;
            text-align: center;
            line-height: 1;
            user-select: none;
            filter: drop-shadow(0px 3px 5px rgba(0,0,0,0.6));
        }

        /* Modal Overlays */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }
        .modal-card {
            background: #ffffff;
            padding: 24px;
            border-radius: 12px;
            width: 85%;
            max-width: 380px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }
        .modal-card h3 { margin-bottom: 12px; color: #111827; font-size: 18px; }
        .modal-card p { color: #4b5563; font-size: 14px; margin-bottom: 20px; line-height: 1.4; }
        .btn-group { display: flex; gap: 10px; justify-content: center; }
        .btn { padding: 10px 20px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 14px; }
        .btn-danger { background-color: #ef4444; color: white; }
        .btn-secondary { background-color: #e5e7eb; color: #374151; }
        .btn-primary { background-color: #2563eb; color: white; }
        
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <!-- Loading Screen -->
    <div id="loader">
        <div class="spinner"></div>
        <p id="loaderText">Finding your location...</p>
    </div>

    <!-- Map Container -->
    <div id="map"></div>

    <div class="top-controls">
        <button id="addHomeBtn" class="btn-ctrl">➕ Add House</button>
    </div>

    <!-- Startup "Is this your home?" Modal -->
    <div id="initHomeModal" class="modal-overlay hidden">
        <div class="modal-card">
            <h3>Welcome! 🏠</h3>
            <p>Is the place you are currently at your home?</p>
            <div class="btn-group">
                <button id="initNoBtn" class="btn btn-secondary">No</button>
                <button id="initYesBtn" class="btn btn-primary">Yes, It's Home</button>
            </div>
        </div>
    </div>

    <!-- House Options (Reset/Cancel) Modal -->
    <div id="houseActionModal" class="modal-overlay hidden">
        <div class="modal-card">
            <h3>House Options 🏠</h3>
            <p>Do you want to reset (remove) this home location?</p>
            <div class="btn-group">
                <button id="cancelHouseBtn" class="btn btn-secondary">Cancel</button>
                <button id="resetHouseBtn" class="btn btn-danger">Reset</button>
            </div>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        let map = null;
        let userMarker = null;
        let houseMarkers = [];
        let pathHistory = [];
        let dotMarkers = [];
        let polyline = null;
        let isAddHomeMode = false;
        let selectedHouseMarker = null;
        let isFirstLocationFound = false;

        const loader = document.getElementById('loader');
        const initHomeModal = document.getElementById('initHomeModal');
        const houseActionModal = document.getElementById('houseActionModal');
        const addHomeBtn = document.getElementById('addHomeBtn');
        let currentCoords = null;

        window.addEventListener('DOMContentLoaded', () => {
            initMap();
            startTracking();
        });

        function initMap() {
            // Satellite 3D-Vision Style Base Layer (Esri World Imagery)
            map = L.map('map', { zoomControl: false }).setView([0, 0], 2);
            L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
                maxZoom: 19,
                attribution: 'Tiles &copy; Esri &mdash; Satellite View'
            }).addTo(map);

            // Zoom adaptive scaling for lines and dots
            map.on('zoomend', updateZoomScaling);

            // Click map to manually add house (if Add House button is active)
            map.on('click', (e) => {
                if (isAddHomeMode) {
                    addHouseMarker(e.latlng);
                    isAddHomeMode = false;
                    addHomeBtn.innerText = "➕ Add House";
                    addHomeBtn.style.background = "rgba(0, 0, 0, 0.75)";
                }
            });
        }

        function createEmojiIcon(emojiSymbol) {
            return L.divIcon({
                className: 'emoji-marker',
                html: `<div>${emojiSymbol}</div>`,
                iconSize: [30, 30],
                iconAnchor: [15, 15]
            });
        }

        function startTracking() {
            if (!navigator.geolocation) {
                alert("Geolocation is not supported by your browser.");
                loader.classList.add('hidden');
                return;
            }
            navigator.geolocation.watchPosition(onLocationUpdate, onLocationError, { 
                enableHighAccuracy: true, 
                maximumAge: 1000 
            });
        }

        function onLocationUpdate(position) {
            const lat = position.coords.latitude;
            const lng = position.coords.longitude;
            currentCoords = [lat, lng];

            // When map gets location for the FIRST time
            if (!isFirstLocationFound) {
                isFirstLocationFound = true;
                loader.classList.add('hidden'); // Hide loading screen
                map.setView(currentCoords, 18);
                
                // Show startup popup
                initHomeModal.classList.remove('hidden');
            }

            // Update user marker (🚶‍♂️)
            if (!userMarker) {
                userMarker = L.marker(currentCoords, { icon: createEmojiIcon('🚶‍♂️'), zIndexOffset: 1000 }).addTo(map);
            } else {
                userMarker.setLatLng(currentCoords);
            }

            // Real Movement Tracking Logic (Avoid random dots)
            if (pathHistory.length > 0) {
                const lastPos = pathHistory[pathHistory.length - 1];
                const distanceMoved = getDistance(currentCoords, lastPos);
                if (distanceMoved < 3) return; // Only draw if moved > 3 meters
            }

            pathHistory.push(currentCoords);

            // Draw Dot
            const zoomLevel = map.getZoom();
            const dot = L.circleMarker(currentCoords, {
                radius: Math.max(2, zoomLevel - 13),
                color: '#3b82f6',
                fillColor: '#60a5fa',
                fillOpacity: 0.9,
                stroke: false
            }).addTo(map);
            
            dotMarkers.push(dot);
            updatePolyline();
        }

        function onLocationError(error) {
            document.getElementById('loaderText').innerText = "Please turn on GPS / Location!";
            console.error("GPS Error:", error);
        }

        // Setup Initial Home Popup Buttons
        document.getElementById('initYesBtn').addEventListener('click', () => {
            if (currentCoords) addHouseMarker(currentCoords);
            initHomeModal.classList.add('hidden');
        });
        document.getElementById('initNoBtn').addEventListener('click', () => {
            initHomeModal.classList.add('hidden');
        });

        // House Marker Logic
        function addHouseMarker(latlng) {
            const house = L.marker(latlng, { icon: createEmojiIcon('🏠') }).addTo(map);
            house.on('click', (e) => {
                L.DomEvent.stopPropagation(e);
                selectedHouseMarker = house;
                houseActionModal.classList.remove('hidden');
            });
            houseMarkers.push(house);
        }

        // Top Control Button (Add House)
        addHomeBtn.addEventListener('click', () => {
            isAddHomeMode = !isAddHomeMode;
            if (isAddHomeMode) {
                addHomeBtn.innerText = "📍 Click Map to Place";
                addHomeBtn.style.background = "#2563eb";
            } else {
                addHomeBtn.innerText = "➕ Add House";
                addHomeBtn.style.background = "rgba(0, 0, 0, 0.75)";
            }
        });

        // House Actions (Cancel/Reset)
        document.getElementById('cancelHouseBtn').addEventListener('click', () => {
            houseActionModal.classList.add('hidden');
            selectedHouseMarker = null;
        });
        document.getElementById('resetHouseBtn').addEventListener('click', () => {
            if (selectedHouseMarker) {
                map.removeLayer(selectedHouseMarker);
                houseMarkers = houseMarkers.filter(m => m !== selectedHouseMarker);
                selectedHouseMarker = null;
            }
            houseActionModal.classList.add('hidden');
        });

        // Draw Lines & Scale with Zoom
        function updatePolyline() {
            if (polyline) map.removeLayer(polyline);
            const zoomLevel = map.getZoom();
            polyline = L.polyline(pathHistory, {
                color: '#2563eb',
                weight: Math.max(3, zoomLevel - 12),
                opacity: 0.8
            }).addTo(map);
        }

        function updateZoomScaling() {
            const zoomLevel = map.getZoom();
            dotMarkers.forEach(dot => {
                dot.setRadius(Math.max(2, zoomLevel - 13));
            });
            if (polyline) {
                polyline.setStyle({ weight: Math.max(3, zoomLevel - 12) });
            }
        }

        // Distance Formula (Meters)
        function getDistance(coord1, coord2) {
            const R = 6371e3;
            const rad1 = coord1[0] * Math.PI / 180;
            const rad2 = coord2[0] * Math.PI / 180;
            const dRad = (coord2[0] - coord1[0]) * Math.PI / 180;
            const dLng = (coord2[1] - coord1[1]) * Math.PI / 180;
            const a = Math.sin(dRad/2) * Math.sin(dRad/2) +
                      Math.cos(rad1) * Math.cos(rad2) *
                      Math.sin(dLng/2) * Math.sin(dLng/2);
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        }
    </script>
</body>
    </html>
