<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hamid's Smart Tracker App - Pro Version</title>
    <!-- Leaflet CSS for Maps -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <style>
        body, html { margin: 0; padding: 0; height: 100%; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #111; }
        #map { height: 70vh; width: 100%; }
        
        /* Loading Overlay to prevent teleport UI glitch */
        #loadingOverlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #111; color: #22c55e; display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 10000; font-size: 20px; font-weight: bold;
        }

        /* UI Controls */
        .controls { padding: 15px; background: #222; display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
        button, select { padding: 10px 15px; border: none; border-radius: 8px; background: #007bff; color: white; cursor: pointer; font-size: 14px; font-weight: bold; }
        button:hover, select:hover { background: #0056b3; }
        .danger { background: #dc3545; }
        .danger:hover { background: #c82333; }
        .success { background: #28a745; }
        
        /* Emoji Selector Box */
        .emoji-selector { width: 100%; text-align: center; margin-top: 5px; color: white; font-weight: bold; }
        .emoji-selector select { background: #333; color: white; }

        /* Popup Overlay */
        .popup-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 2000; justify-content: center; align-items: center; }
        .popup-box { background: white; padding: 25px; border-radius: 12px; text-align: center; color: black; }
        .popup-box h3 { margin-top: 0; }
        .popup-box button { margin: 5px; width: 100px; }
        
        /* Custom Emoji Marker Styling */
        .custom-emoji-marker { font-size: 30px; text-align: center; line-height: 1; filter: drop-shadow(0px 3px 4px rgba(0,0,0,0.5)); }
    </style>
</head>
<body>

    <!-- GPS Loading Screen -->
    <div id="loadingOverlay">
        <div style="font-size: 40px; margin-bottom: 10px;">🛰️</div>
        Locking Current Location...
    </div>

    <!-- Map Container -->
    <div id="map"></div>

    <!-- App Controls -->
    <div class="controls">
        <button id="toggleLinesBtn" class="success">Toggle Lines / Dots</button>
        
        <button id="goHomeBtn" class="success">🏠 Go Home</button>
        
        <!-- Naya Remove Line Button -->
        <button id="removeLineBtn" class="danger">🗑️ Remove Line</button>
        
        <select id="addLocation">
            <option value="none">➕ Add Place...</option>
            <option value="home">🏠 Home</option>
            <option value="mosque">🕌 Mosque</option>
            <option value="office">🏢 Office</option>
            <option value="market">🛒 Market</option>
        </select>
        
        <div class="emoji-selector">
            <label for="vehicleSelect">Choose your avatar:</label>
            <select id="vehicleSelect">
                <option value="🚶">🚶 Person</option>
                <option value="🚲">🚲 Bicycle</option>
                <option value="🏍️" selected>🏍️ Motorcycle</option>
                <option value="🚗">🚗 Car</option>
            </select>
        </div>
    </div>

    <!-- Go Home Pop-up -->
    <div class="popup-overlay" id="goHomePopup">
        <div class="popup-box">
            <h3>Start navigation to Home?</h3>
            <button id="confirmYes" style="background: #28a745;">✅ Yes</button>
            <button id="confirmCancel" class="danger">❌ Cancel</button>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script>
        // 1. Map Setup (Start invisible, focus on user later)
        const map = L.map('map', { zoomControl: false }).setView([0, 0], 2); 
        L.tileLayer('https://{s}.google.com/vt/lyrs=m&x={x}&y={y}&z={z}', {
            maxZoom: 20,
            subdomains: ['mt0', 'mt1', 'mt2', 'mt3']
        }).addTo(map);

        let currentAvatar = "🏍️";
        let userMarker = null;
        let isFirstLocationFound = false;
        let destinationMode = null; 
        
        // Example Variables for tracking lines
        let greenLineLayer = null; // Agar line bani hai to isme save hogi

        // 2. Fetch True Current Location (Fix for Teleport Bug)
        function createEmojiMarker(emoji) {
            return L.divIcon({ className: 'custom-emoji-marker', html: `<div>${emoji}</div>`, iconSize: [30, 30], iconAnchor: [15, 15] });
        }

        navigator.geolocation.watchPosition((position) => {
            const lat = position.coords.latitude;
            const lng = position.coords.longitude;
            const currentCoords = [lat, lng];

            // Agar pehli baar location mil rahi hai
            if (!isFirstLocationFound) {
                isFirstLocationFound = true;
                // Loading screen hatai aur seedha user par zoom kiya
                document.getElementById('loadingOverlay').style.display = 'none';
                map.setView(currentCoords, 18);
                
                // Character ko wahi place kiya
                userMarker = L.marker(currentCoords, { icon: createEmojiMarker(currentAvatar) }).addTo(map);
            } else {
                // Agar user move kar raha hai to character hilao
                userMarker.setLatLng(currentCoords);
            }
        }, (error) => {
            alert("Error: Please turn on your Device GPS Location!");
            document.getElementById('loadingOverlay').innerText = "Location access denied. Please enable GPS.";
        }, { enableHighAccuracy: true });

        // 3. Emoji Selector Logic
        document.getElementById('vehicleSelect').addEventListener('change', function(e) {
            currentAvatar = e.target.value;
            if (userMarker) {
                userMarker.setIcon(createEmojiMarker(currentAvatar));
            }
        });

        // 4. Toggle Lines / Dots
        let isLineMode = false;
        document.getElementById('toggleLinesBtn').addEventListener('click', function() {
            isLineMode = !isLineMode;
            alert(isLineMode ? "Switched to Green Lines Mode" : "Switched to Close Dots Mode");
        });

        // 5. REMOVE LINE BUTTON LOGIC (Aapki nayi demand)
        document.getElementById('removeLineBtn').addEventListener('click', function() {
            // Asli app mein aap array clear karenge. Ye example layer ko remove karta hai.
            if (greenLineLayer) {
                map.removeLayer(greenLineLayer);
                greenLineLayer = null;
            }
            alert("Green Line aur Dots screen se remove kar diye gaye hain!");
        });

        // 6. Go Home Pop-up Logic
        const popup = document.getElementById('goHomePopup');
        document.getElementById('goHomeBtn').addEventListener('click', () => popup.style.display = 'flex');
        
        document.getElementById('confirmCancel').addEventListener('click', () => popup.style.display = 'none');
        document.getElementById('confirmYes').addEventListener('click', () => {
            popup.style.display = 'none';
            alert("System Started! Peeche se green line mitne wala rasta shuru ho gaya hai.");
        });

        // 7. Add Custom Location (Mosque, Office, Market) on Map Click
        document.getElementById('addLocation').addEventListener('change', function(e) {
            if(e.target.value !== "none") {
                destinationMode = e.target.value;
                alert("Map par zoom kar ke jahan lagana hai wahan click karein!");
            }
        });

        map.on('click', function(e) {
            if(destinationMode) {
                let emojiIcon = "";
                if(destinationMode === 'home') emojiIcon = "🏠";
                if(destinationMode === 'mosque') emojiIcon = "🕌";
                if(destinationMode === 'office') emojiIcon = "🏢";
                if(destinationMode === 'market') emojiIcon = "🛒";

                L.marker(e.latlng, { icon: createEmojiMarker(emojiIcon) }).addTo(map).bindPopup("Your " + destinationMode).openPopup();
                
                alert(emojiIcon + " Map par lag gaya hai!");
                destinationMode = null; 
                document.getElementById('addLocation').value = "none";
            }
        });

    </script>
</body>
    </html>
