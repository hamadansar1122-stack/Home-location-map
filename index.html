<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Precision GPS Tracker</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        html, body, #map {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }
        #loader {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #111827;
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10000;
            transition: opacity 0.5s ease;
        }
        .spinner {
            border: 4px solid rgba(255,255,255,0.3);
            border-top: 4px solid #3b82f6;
            border-radius: 50%;
            width: 40px; height: 40px;
            animation: spin 1s linear infinite;
            margin-bottom: 15px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .top-controls {
            position: absolute;
            top: 15px;
            right: 15px;
            z-index: 2000;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .btn-ctrl {
            background: rgba(0, 0, 0, 0.85);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 10px 14px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            backdrop-filter: blur(5px);
            font-size: 13px;
        }

        .hud-panel {
            position: absolute;
            bottom: 25px;
            left: 15px;
            z-index: 2000;
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 12px 18px;
            border-radius: 12px;
            color: white;
            backdrop-filter: blur(8px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }
        .hud-item {
            font-size: 13px;
            margin-bottom: 4px;
        }
        .hud-value {
            font-weight: bold;
            color: #38bdf8;
        }

        .emoji-marker {
            font-size: 28px;
            text-align: center;
            line-height: 1;
            user-select: none;
            filter: drop-shadow(0px 3px 5px rgba(0,0,0,0.6));
            transition: all 0.3s linear;
        }

        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }
        .modal-card {
            background: #ffffff;
            padding: 24px;
            border-radius: 12px;
            width: 85%;
            max-width: 380px;
            text-align: center;
            color: #111;
        }
        .modal-card h3 { margin-bottom: 12px; }
        .modal-card p { color: #4b5563; font-size: 14px; margin-bottom: 20px; }
        .btn-group { display: flex; gap: 10px; justify-content: center; }
        .btn { padding: 10px 20px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .btn-danger { background-color: #ef4444; color: white; }
        .btn-secondary { background-color: #e5e7eb; color: #374151; }
        .btn-primary { background-color: #2563eb; color: white; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="loader">
        <div class="spinner"></div>
        <p id="loaderText">Calibrating High-Precision GPS...</p>
    </div>

    <div id="map"></div>

    <div class="hud-panel">
        <div class="hud-item">Speed: <span id="speedVal" class="hud-value">0.0</span> km/h</div>
        <div class="hud-item">Distance: <span id="distVal" class="hud-value">0</span> m</div>
        <div class="hud-item">GPS Accuracy: <span id="accVal" class="hud-value">--</span> m</div>
    </div>

    <div class="top-controls">
        <button id="addHomeBtn" class="btn-ctrl">🏠 Add Home</button>
        <button id="recenterBtn" class="btn-ctrl">🎯 Recenter</button>
    </div>

    <div id="initHomeModal" class="modal-overlay hidden">
        <div class="modal-card">
            <h3>Welcome! 🏠</h3>
            <p>Set your current location as Home?</p>
            <div class="btn-group">
                <button id="initNoBtn" class="btn btn-secondary">No</button>
                <button id="initYesBtn" class="btn btn-primary">Yes, Set Home</button>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        let map = null;
        let userMarker = null;
        let pathHistory = [];
        let dotMarkers = [];
        let polyline = null;
        let isAddHomeMode = false;
        let isFirstLocationFound = false;
        let currentCoords = null;
        let lastValidCoords = null;
        let totalDistance = 0;
        let wakeLock = null;

        const loader = document.getElementById('loader');

        window.addEventListener('DOMContentLoaded', () => {
            initMap();
            requestWakeLock();
            startBackgroundTracking();

            setTimeout(() => {
                if (!isFirstLocationFound) {
                    loader.classList.add('hidden');
                }
            }, 6000);
        });

        async function requestWakeLock() {
            try {
                if ('wakeLock' in navigator) {
                    wakeLock = await navigator.wakeLock.request('screen');
                }
            } catch (err) { console.log(err); }
        }

        function initMap() {
            map = L.map('map', { zoomControl: false, maxZoom: 20 }).setView([0, 0], 2);
            
            L.tileLayer('https://{s}.google.com/vt/lyrs=s,h&x={x}&y={y}&z={z}', {
                maxZoom: 20,
                subdomains: ['mt0', 'mt1', 'mt2', 'mt3']
            }).addTo(map);

            map.on('click', (e) => {
                if (isAddHomeMode) {
                    addHouseMarker(e.latlng);
                    isAddHomeMode = false;
                    document.getElementById('addHomeBtn').innerText = "🏠 Add Home";
                    document.getElementById('addHomeBtn').style.background = "rgba(0, 0, 0, 0.85)";
                }
            });
        }

        function createEmojiIcon(emojiSymbol) {
            return L.divIcon({
                className: 'emoji-marker',
                html: `<div>${emojiSymbol}</div>`,
                iconSize: [30, 30],
                iconAnchor: [15, 15]
            });
        }

        function startBackgroundTracking() {
            if (!navigator.geolocation) {
                alert("GPS not supported!");
                return;
            }

            navigator.geolocation.watchPosition(
                onLocationUpdate, 
                onLocationError, 
                { 
                    enableHighAccuracy: true, 
                    maximumAge: 1000, 
                    timeout: 10000 
                }
            );
        }

        function onLocationUpdate(position) {
            const accuracy = position.coords.accuracy;
            document.getElementById('accVal').innerText = Math.round(accuracy);

            // STRICT FILTER: Ignore bad signals (> 15 meters inaccuracy) to prevent rooftop jumps
            if (accuracy > 15) return;

            const lat = position.coords.latitude;
            const lng = position.coords.longitude;
            const speed = position.coords.speed ? (position.coords.speed * 3.6).toFixed(1) : "0.0";
            
            document.getElementById('speedVal').innerText = speed;
            currentCoords = [lat, lng];

            if (!isFirstLocationFound) {
                isFirstLocationFound = true;
                lastValidCoords = currentCoords;
                loader.classList.add('hidden');
                map.setView(currentCoords, 19);
                document.getElementById('initHomeModal').classList.remove('hidden');
                
                userMarker = L.marker(currentCoords, { icon: createEmojiIcon('🚶‍♂️'), zIndexOffset: 1000 }).addTo(map);
                return; 
            }

            // Calculate distance moved from last known good position
            let moveDist = getDistance(lastValidCoords, currentCoords);

            // Only update path if moved at least 5 meters (Prevents jitter while standing still)
            if (moveDist >= 5) {
                totalDistance += moveDist;
                document.getElementById('distVal').innerText = Math.round(totalDistance);
                
                lastValidCoords = currentCoords;
                userMarker.setLatLng(currentCoords);
                map.panTo(currentCoords, { animate: true, duration: 0.5 });
                
                commitPathPoint(currentCoords);
            } else {
                // Smooth position adjustment for small movements
                userMarker.setLatLng(currentCoords);
            }
        }

        function commitPathPoint(coords) {
            pathHistory.push(coords);
            const dot = L.circleMarker(coords, {
                radius: 4,
                color: '#2563eb',
                fillColor: '#60a5fa',
                fillOpacity: 0.9,
                stroke: false
            }).addTo(map);

            dotMarkers.push(dot);

            if (polyline) map.removeLayer(polyline);
            polyline = L.polyline(pathHistory, {
                color: '#2563eb',
                weight: 4,
                opacity: 0.8
            }).addTo(map);
        }

        function onLocationError(err) {
            console.log(err);
        }

        function addHouseMarker(latlng) {
            L.marker(latlng, { icon: createEmojiIcon('🏠') }).addTo(map);
        }

        document.getElementById('addHomeBtn').addEventListener('click', () => {
            isAddHomeMode = !isAddHomeMode;
            document.getElementById('addHomeBtn').innerText = isAddHomeMode ? "📍 Click Map" : "🏠 Add Home";
        });

        document.getElementById('recenterBtn').addEventListener('click', () => {
            if (currentCoords) map.setView(currentCoords, 19, { animate: true });
        });

        document.getElementById('initYesBtn').addEventListener('click', () => {
            if (currentCoords) addHouseMarker(currentCoords);
            document.getElementById('initHomeModal').classList.add('hidden');
        });
        document.getElementById('initNoBtn').addEventListener('click', () => {
            document.getElementById('initHomeModal').classList.add('hidden');
        });

        function getDistance(coord1, coord2) {
            const R = 6371e3;
            const rad1 = coord1[0] * Math.PI / 180;
            const rad2 = coord2[0] * Math.PI / 180;
            const dRad = (coord2[0] - coord1[0]) * Math.PI / 180;
            const dLng = (coord2[1] - coord1[1]) * Math.PI / 180;
            const a = Math.sin(dRad/2) * Math.sin(dRad/2) +
                      Math.cos(rad1) * Math.cos(rad2) *
                      Math.sin(dLng/2) * Math.sin(dLng/2);
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        }
    </script>
</body>
    </html>
